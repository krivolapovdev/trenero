pre-commit:
  parallel: true
  jobs:
    - name: phone
      root: frontend
      stage_fixed: true
      run: dart fix --apply && dart format .

    - name: backend
      root: backend
      stage_fixed: true
      run: ./gradlew spotlessApply

    - name: server
      root: server
      stage_fixed: true
      run: go fmt ./... && go vet ./...
